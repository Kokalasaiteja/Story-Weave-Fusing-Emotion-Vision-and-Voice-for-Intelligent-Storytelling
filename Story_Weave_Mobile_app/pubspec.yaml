name: story_weave_mobile_app
description: "Story Weave - Companion Mobile Application for Intelligent Multimodal Storytelling"
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.12.2

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  http: ^1.2.2
  google_fonts: ^6.2.1
  audioplayers: ^6.0.0
  shared_preferences: ^2.2.3
  cached_network_image: ^3.3.1
  share_plus: ^9.0.0
  url_launcher: ^6.3.0
  intl: ^0.19.0
  path_provider: ^2.1.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.13.1

flutter_launcher_icons:
  android: "launcher_icon"
  ios: true
  image_path: "assets/icon/app_icon.png"
  adaptive_icon_background: "#080B11"
  adaptive_icon_foreground: "assets/icon/ic_launcher_foreground.png"

flutter:
  uses-material-design: true

  assets:
    - assets/icon/
    - assets/images/
